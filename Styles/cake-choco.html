<!DOCTYPE html>
<html lang="cs">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Informace o produktu</title>

    <link rel="stylesheet" href="/Styles/main.css">
    <link rel="stylesheet" href="/Styles/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet">
    <link href="https://fonts.cdnfonts.com/css/mervale-script" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.css" />


</head>

<body>



    <header>
        <a href="index.html"><img src="/Images/logo.png" alt="LOGO" width="140px"></a>
    </header>

    <main class="product-detail">
        <section>
            <img src="/Images/Cake_chocolate.jpg" alt="Čokoládový dort" class="main-cake-img" >
        </section>


        <section class="product-info">
            <div class="cake-product">
                <p class="text-brown text-semibold text-xl">Čokoládový dort</p>
                <div class="cake-rating">
                    <img src="/Icons/Rating_star.png" alt="rating" height="32">
                    <img src="/Icons/Rating_star.png" alt="rating" height="32">
                    <img src="/Icons/Rating_star.png" alt="rating" height="32">
                    <img src="/Icons/Rating_star.png" alt="rating" height="32">
                    <img src="/Icons/Rating_star.png" alt="rating" height="32">
                </div>
                <p class="text-brown text-regular text-xl">od 1099 Kč</p>
            </div>




            <p class="description text-brown text-regular text-m">
                Bohatý kakaový korpus s krémem z kvalitní čokolády a čokoládovými hoblinkami.
                Intenzivní chuť pro všechny milovníky čokolády.
            </p>


            <div class="size-selector">
                <p class="size-text text-brown text-medium text-m">Velikost</p>
                <div class="cake-size">
                    <button class="size-btn text-m text-medium text-brown" >Malý <span class=" text-s text-regular text-brown">6 porcí</span></button>
                    <button class="size-btn text-m text-medium text-brown">Střední <span class=" text-s text-regular text-brown">10 porcí</span></button>
                    <button class="size-btn text-m text-medium text-brown">Velký <span class=" text-s text-regular text-brown">14 porcí</span></button>
                </div>  
            </div>


            
            <div class="cake-info">
                <label for="cake-text" class="text-m text-medium text-brown">Nápis na dort</label>
                <textarea id="cake-text" placeholder="Napište text (např. Všechno nejlepší)" class="cake-textarea text-s text-grey-font text-regular"></textarea>
            </div>


            <button class="add-btn text-regular text-light-ping text-l">Přidat do košíku</button>
        </section>



    </main>

    <footer class="footer">

        <div class="footer-left">
            <a href="index.html"><img src="/Images/darklogo.png" alt="logo" width="280px" class="footer-logo"></a>

            <div class="footer-icons">
                <a href="#"><img src="/Icons/facebook-svgrepo-com.svg" alt="facebook" height="25"></a>
                <a href="#"><img src="/Icons/Gallery.svg" alt="galerie" height="25"></a>
                <a href="#"><img src="/Icons/tiktok.svg" alt="tiktok" height="25"></a>
                <a href=""><img src="/Icons/instagram-svgrepo-com.svg" alt="instagram" height="25"></a>
            </div>
        </div>

        <ul class="footer-right">
            <li class="footer-ul"><a href="#" class="footer-a text-s text-light-ping text-light">Informace</a></li>
            <li class="footer-ul"><a href="#" class="footer-a text-s text-light-ping text-light">Zákaznický servis</a></li>
            <li class="footer-ul"><a href="#" class="footer-a text-s text-light-ping text-light">Kontakty</a></li>
        </ul>

    </footer>







</body>

</html>
